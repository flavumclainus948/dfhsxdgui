name: 🟢 Hello Phase

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      loop_count:
        description: 'Siklus tersisa (default 18000)'
        required: true
        default: '18000'

permissions:
  actions: write
  contents: read

jobs:
  run-hello:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Jalankan hello world (timeout aman)
        env:
          LOOP_COUNT_IN: ${{ github.event.inputs.loop_count }}
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=5s 40 bash -c 'echo "hello world" & sleep 20'
          RC=$?
          set -e
          if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then
            echo "⏰ Kena timeout 40s, dianggap sukses"
          else
            echo "hello selesai, exit=$RC"
          fi

  trigger-lscpu:
    needs: run-hello
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Panggil LSCPU Phase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOP_COUNT_IN: ${{ github.event.inputs.loop_count }}
        run: |
          set -euo pipefail
          # push event → input kosong → default 18000
          LOOP_COUNT="${LOOP_COUNT_IN:-18000}"
          if ! [[ "$LOOP_COUNT" =~ ^[0-9]+$ ]]; then
            echo "::error::loop_count bukan angka: '$LOOP_COUNT'"
            exit 1
          fi
          if [ "$LOOP_COUNT" -le 0 ]; then
            echo "loop_count=0, loop berhenti"
            exit 0
          fi
          new_loop=$((LOOP_COUNT - 1))
          echo "Dispatch phase-lscpu.yml dengan loop_count=$new_loop"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/phase-lscpu.yml/dispatches" \
            -d "{\"ref\":\"${{ github.event.repository.default_branch }}\",\"inputs\":{\"loop_count\":\"$new_loop\"}}"